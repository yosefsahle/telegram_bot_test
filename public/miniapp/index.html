<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lottery</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#17202a}.wrap{max-width:560px;margin:auto;padding:24px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0001}button{border:0;border-radius:10px;padding:12px 16px;background:#1688d4;color:white;font-size:16px;width:100%}.muted{color:#667085}</style></head><body><main class="wrap"><section class="card"><h2 id="heading">Welcome</h2><p id="status" class="muted">Connecting securely to Telegram…</p><button id="retry" hidden>Try again</button></section></main><script>
const API='/api/v1'; const statusEl=document.getElementById('status'); const heading=document.getElementById('heading'); const retry=document.getElementById('retry');
async function start(){try{const tg=window.Telegram?.WebApp;if(!tg||!tg.initData){throw new Error('Please open this Mini App from the official Telegram bot.');}tg.ready();tg.expand();const r=await fetch(API+'/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'Authentication failed.');sessionStorage.setItem('lottery_access_token',j.data.access_token);heading.textContent='You are signed in';statusEl.textContent='Telegram account verified. Your lottery profile is ready.';}catch(e){statusEl.textContent=e.message;retry.hidden=false;}}
retry.addEventListener('click',start);start();
</script></body></html>
